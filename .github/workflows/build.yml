name: Build APK dan Deploy Web
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: dodaka-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak proyek dari app.zip
        run: unzip -q app.zip -d proj
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        working-directory: proj
        run: npm install
      - name: Salin Leaflet ke www
        working-directory: proj
        run: |
          mkdir -p www/vendor/leaflet
          cp -r node_modules/leaflet/dist/* www/vendor/leaflet/
      - name: Service worker anti-basi (network-first)
        working-directory: proj
        run: |
          cat > www/service-worker.js <<SW
          const CACHE_NAME = "dodaka-map-build-${{ github.run_number }}";
          self.addEventListener("install", e => { self.skipWaiting(); });
          self.addEventListener("activate", e => e.waitUntil(
            caches.keys().then(keys => Promise.all(keys.filter(k => k !== CACHE_NAME).map(k => caches.delete(k))))
              .then(() => self.clients.claim())
          ));
          self.addEventListener("fetch", e => {
            if (e.request.method !== "GET") return;
            e.respondWith(
              fetch(e.request).then(res => {
                if (new URL(e.request.url).origin === self.location.origin) {
                  const copy = res.clone();
                  caches.open(CACHE_NAME).then(c => c.put(e.request, copy));
                }
                return res;
              }).catch(() => caches.match(e.request).then(r => r || caches.match("./index.html")))
            );
          });
          SW
          sed -i 's/^          //' www/service-worker.js
      - name: Arahkan APK ke alamat GitHub Pages
        working-directory: proj
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          URL="https://${OWNER}.github.io/${REPO}/"
          echo "URL aplikasi: $URL"
          node -e '
            const fs=require("fs");
            const c=JSON.parse(fs.readFileSync("capacitor.config.json","utf8"));
            c.server={url:process.argv[1],cleartext:false};
            fs.writeFileSync("capacitor.config.json",JSON.stringify(c,null,2));
          ' "$URL"
          cat capacitor.config.json
      - name: Buat proyek Android
        working-directory: proj
        run: |
          npx cap add android
          npx cap sync android
      - name: Pasang ikon aplikasi
        working-directory: proj
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp resources/mipmap-$d/*.png $RES/mipmap-$d/
          done
      - name: Pasang kunci tanda tangan tetap
        working-directory: proj
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Build APK
        working-directory: proj/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Siapkan file APK
        run: cp proj/android/app/build/outputs/apk/debug/app-debug.apk DODAKA-MAP.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DODAKA-MAP-apk
          path: DODAKA-MAP.apk
      - name: Terbitkan di Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: DODAKA MAP v${{ github.run_number }}
          files: DODAKA-MAP.apk
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: proj/www
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
