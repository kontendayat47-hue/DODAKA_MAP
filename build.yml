name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak proyek dari app.zip
        run: unzip -q app.zip -d proj
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        working-directory: proj
        run: npm install
      - name: Salin Leaflet ke www
        working-directory: proj
        run: |
          mkdir -p www/vendor/leaflet
          cp -r node_modules/leaflet/dist/* www/vendor/leaflet/
      - name: Buat proyek Android
        working-directory: proj
        run: |
          npx cap add android
          npx cap sync android
      - name: Pasang ikon aplikasi
        working-directory: proj
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp resources/mipmap-$d/*.png $RES/mipmap-$d/
          done
      - name: Pasang kunci tanda tangan tetap
        working-directory: proj
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Build APK
        working-directory: proj/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Siapkan file APK
        run: cp proj/android/app/build/outputs/apk/debug/app-debug.apk DODAKA-MAP.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DODAKA-MAP-apk
          path: DODAKA-MAP.apk
      - name: Terbitkan di Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: DODAKA MAP v${{ github.run_number }}
          files: DODAKA-MAP.apk
